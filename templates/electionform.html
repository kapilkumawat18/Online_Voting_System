<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='electionform.css') }}">
</head>
<body>
    {% include 'header.html' %}
    <div class="containers">
        <div id="add-messages"></div>
        <section class="add-election">
            <h2>Add New Election</h2>
            <form action="/add_election" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <!-- Election Title -->
                <label for="title">Election Title:</label>
                <input type="text" id="title" name="title" placeholder="Enter Title" required>

                <!-- Election Description -->
                <label for="description">Description:</label>
                <textarea id="description" name="description" placeholder="Enter Description" required></textarea>

                <!-- Election Status -->
                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    <option value="Active">Active</option>
                    <option value="Upcoming">Upcoming</option>
                </select>

                <!-- Election Start and End Dates -->
                <label for="start_date">Start Date:</label>
                <input type="date" id="start_date" name="start_date" required>

                <label for="end_date">End Date:</label>
                <input type="date" id="end_date" name="end_date" required>

                <!-- Add Candidates Section -->
                <label for="candidates">Add Candidates:</label>
                <div id="candidate-section">
                    <div class="candidate-entry">
                        <input type="text" name="candidates[]" placeholder="Enter Name/Voter ID (e.g., John Doe/12345)" required>
                        <button type="button" class="add-candidate">Add More</button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="button">Add Election</button>
            </form>
        </section>
    </div> 
    <script src="{{ url_for('static', filename='header.js') }}"></script>
    <script>
       document.addEventListener("DOMContentLoaded", function () {
        const candidateSection = document.getElementById("candidate-section");

        // Add new candidate row
        candidateSection.addEventListener("click", function (event) {
            if (event.target.classList.contains("add-candidate")) {
                const newCandidateEntry = document.createElement("div");
                newCandidateEntry.classList.add("candidate-entry");

                newCandidateEntry.innerHTML = `
                    <input type="text" name="candidates[]" placeholder="Enter Name/Voter ID (e.g., John Doe/12345)" required>
                    <button type="button" class="remove-candidate">Remove</button>
                `;

                candidateSection.appendChild(newCandidateEntry);
            }
        });

        // Remove candidate row
        candidateSection.addEventListener("click", function (event) {
            if (event.target.classList.contains("remove-candidate")) {
                event.target.parentElement.remove();
            }
        });
    });
    </script>
</body>
</html>
