<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code|default('Error') }} — SecureVote</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='securevote-v2-release.css') }}">
  <style>
    body {
      min-height: 100vh;
      background: #070b14;
      color: #f8fafc;
      font-family: Inter, system-ui, sans-serif
    }

    .sv-error {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px
    }

    .sv-box {
      max-width: 620px;
      text-align: center;
      padding: 42px;
      border: 1px solid rgba(148, 163, 184, .16);
      border-radius: 26px;
      background: rgba(17, 24, 39, .78);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .28)
    }

    .sv-code {
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 900;
      letter-spacing: -.08em;
      margin: 0;
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
      color: transparent;
      background-clip: text
    }

    h1 {
      font-size: 1.6rem;
      margin: 4px 0 10px
    }

    .sv-muted {
      color: #94a3b8;
      line-height: 1.6
    }

    .sv-home {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      border-radius: 13px;
      text-decoration: none;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(135deg, #7c3aed, #06b6d4)
    }
  </style>
</head>

<body>
  <main class="sv-error">
    <section class="sv-box">
      <p class="sv-code">{{ code|default(500) }}</p>
      <h1>{{ title|default("Something went wrong") }}</h1>
      <p class="sv-muted">{{ message|default("We couldn't complete that request. Please try again.") }}</p>
      <a class="sv-home" href="{{ url_for('home') }}">Return home</a>
    </section>
  </main>
</body>

</html>
